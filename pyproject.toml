[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11,<0.12" ]

[project]
name = "mapstp"
version = "1.1.1.dev1"
description = "Transfers meta information from STP to MCNP"
readme = "README.rst"
keywords = [
  "GEOUNED",
  "MCNP",
  "SpaceClaim",
  "STP",
  "SuperMC",
]
license = { text = "MIT" }
requires-python = ">=3.12,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cyclopts>=3.24",
  "eliot>=1.17.5",
  "numpy>=2.4",
  "openpyxl>=3",
  "packaging>=25",
  "pandas>=2",
  "rich>=14.2",
]
[[project.authors]]
name = "dvp2015"
email = "dmitri_portnov@yahoo.com"
[project.scripts]
mapstp = "mapstp.__main__:main"
[project.urls]
homepage = "https://github.com/MC-kit/map-stp"
repository = "https://github.com/MC-kit/map-stp"

[dependency-groups]
dev = [ { include-group = "style" }, { include-group = "test" } ]
test = [
  "pytest>=9",
  "pytest-cov>=7.1",
  "pytest-durations>=1.5",
  "pytest-mock>=3.14",
  "pytest-xdist[psutil]>=3.8",
  "xdoctest>=1.2",
]
docs = [
  "rstcheck[sphinx,toml]>=6.2.5",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.2",
  "sphinx-togglebutton>=0.3.2",
]
analyze = [ "jupyterlab>=4.2.5", "jupytext>=1.16.4" ]
coverage = [ "coverage[toml]>=7.9.2" ]
lint = [ "pylint", "pylint-per-file-ignores" ]
mypy = [ "mypy>=1.2", "pep8-naming>=0.12.1", "types-setuptools>=80.9.0.20250529" ]
pre_commit = [ "pre-commit>=4.3" ]
pyright = [ "pyright>=1.1.406" ]
ruff = [ "ruff>=0.0.259" ]
style = [
  { include-group = "lint" },
  { include-group = "mypy" },
  { include-group = "pre_commit" },
  { include-group = "pyright" },
  { include-group = "ruff" },
]
typeguard = [ "typeguard>=4.1.5" ]

[tool.mypy]
python_version = "3.14"
cache_dir = ".cache/mypy"
disallow_untyped_defs = true
exclude = """(?x)(
  data/.*.py$     # python files given as data (for SpaceClaim)
)"""
files = "src/**/*.py"
follow_imports = "silent"
pretty = true
strict = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = [
  "IPython.core.magic",
  "IPython.core.magic_arguments",
  "click",
  "click.testing",
  "cyclopts",
  "dask.*",
  "duckdb",
  "eliot",
  "eliot.*",
  "loguru",
  "mckit_nuclides.*",
  "msgspec",
  "multipledispatch",
  "nox",
  "numpy",
  "numpy.testing",
  "pandas",
  "polars",
  "pytest",
  "rich.*",
  "scipy.constants",
  "scipy.sparse",
  "tomli",
  "tomllib",
  "xdoctest",
]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = [ "tomllib" ]
allow_redefinition = true
disable_error_code = "no-redef"
[[tool.mypy.overrides]]
module = [ "tests.cli.*" ]
disable_error_code = "type-arg"
[[tool.mypy.overrides]]
module = [ "conftest" ]
disable_error_code = "misc"

[tool.coverage]
[tool.coverage.paths]
source = [ "src" ]
[tool.coverage.report]
exclude_lines = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if __name__ == .__main__.:",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if self.debug",
  "if TYPE_CHECKING:",
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 85  # TODO dvp: restore tests for STP parsing code or remove it at all
ignore_errors = true
omit = [ "**/__init__.py", "*_tab.py" ]
show_missing = true
skip_covered = true
sort = "Cover"
[tool.coverage.run]
branch = true
omit = [ "**/__init__.py", "*_tab.py", "tools/*.py" ]
parallel = true
source = [ "src" ]

[tool.xdoctest]
quiet = true
options = ""

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
paths = [ "src" ]
deps-file = "pyproject.toml"
sections = [ "project.dependencies" ]
exclude-deps = [
  "openpyxl",
]

[tool.rstcheck]
report_level = "ERROR"
ignore_messages = '(Unknown directive type \"cyclopts|todo|(auto(module|class|function))\"\.)'
