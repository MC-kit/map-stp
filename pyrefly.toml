enable-fallback-search-path = true
infer-with-first-use = false
project-includes = ["src"]
project-excludes = [
    "**/data",
    "**/parser",
    "**/__pycache__",
    "**/.*",
]
python-platform = "linux"
python-version = "3.13.0"
search-path = ["src", "tests"]

[errors]
untyped-import = "ignore"
missing-import = "error"
